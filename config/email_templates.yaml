# Application e-mail templates (Basic mode, and AI-mode fallback).
#
# Placeholders (all built strictly from verified CV facts and job posting analysis;
# empty placeholders disappear cleanly):
#   {subject_line}         "Application – <Position> – <Name>" / "<Position> Application – <Name>"
#   {greeting}             "Dear Hiring Team," / "Dear Recruitment Team," / "Dear <First Name>,"
#   {opening_sentence}     direct, confident application opening naming the role and company
#   {role_sentence}        current title, verified years, and 3-4 role-relevant technologies
#   {achievement_sentence} 1-2 relevant professional/project accomplishments (employment vs projects separated)
#   {portfolio_sentence}   natural reference to attached CV and available Portfolio/GitHub/LinkedIn links
#   {closing_sentence}     confident, humble closing
#   {sign_off}             "Best regards," / "Kind regards," / "Hormat saya,"
#   {signature}            verified name, phone, email, and labeled valid links
# Older placeholders remain supported for custom templates:
#   {job_title} {company} {name} {skills_sentence} {current_title} {years_phrase} {skills_phrase} {experience_phrase}

en:
  subject: "{subject_line}"
  body: |
    {greeting}

    {opening_sentence}

    {role_sentence}

    {achievement_sentence}

    {portfolio_sentence} {closing_sentence}

    {sign_off}
    {signature}

id:
  subject: "{subject_line}"
  body: |
    {greeting}

    {opening_sentence}

    {role_sentence}

    {achievement_sentence}

    {portfolio_sentence} {closing_sentence}

    {sign_off}
    {signature}

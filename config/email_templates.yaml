# Application e-mail templates (Basic mode, and AI-mode fallback).
#
# Placeholders (each is built only from facts in your CV, and disappears cleanly when empty):
#   {greeting}             "Dear Acme Hiring Team," / "Dear Hiring Team," (company unknown)
#   {job_title} {company} {name} {signature}
#   {role_sentence}        "I'm currently a Developer Supervisor at X, and I have 3+ years of experience as a
#                          Fullstack Engineer."  (current vs most recent role comes from the CV dates)
#   {achievement_sentence} one real CV bullet that fits the job, quoted as written (English only)
#   {skills_sentence}      job skills your CV shows in actual work ("I've worked hands-on with ..."),
#                          or only "My skill set also includes ..." when they appear just in the skills list
# Older placeholders still work: {current_title} {years_phrase} {skills_phrase} {experience_phrase}
#
# Keep it short and plain. Recruiters skim: avoid "I am writing to...", "I would welcome the
# opportunity...", "passionate", "proven track record".

en:
  subject: "Application for {job_title} - {name}"
  body: |
    {greeting}

    I'd like to apply for the {job_title} position.

    {role_sentence} {achievement_sentence}

    {skills_sentence}

    My CV is attached. I'd be happy to talk about the role at a time that suits you.

    Best regards,
    {signature}

id:
  subject: "Lamaran Posisi {job_title} - {name}"
  body: |
    {greeting}

    Dengan hormat, saya ingin melamar untuk posisi {job_title}.

    {role_sentence}

    {skills_sentence}

    CV saya terlampir. Saya siap berdiskusi lebih lanjut pada waktu yang Bapak/Ibu tentukan.

    Hormat saya,
    {signature}

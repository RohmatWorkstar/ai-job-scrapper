# AI Job Intelligence & Discovery System - application settings.
# Credentials never belong here: put them in .env (see .env.example).

application:
  name: AI Job Intelligence & Discovery System
  timezone: Asia/Jakarta
  user_agent: "AIJobIntelligence/1.0 (local job research CLI; respects robots.txt)"

candidate:
  cv_directory: cv
  # Used for location/remote-eligibility scoring. Not sent to any service.
  home_country: Indonesia

paths:
  database: data/database/job_intelligence.sqlite3
  cache_directory: data/cache
  log_directory: data/logs
  preferences_file: data/preferences.json

search:
  default_geography: indonesia_worldwide      # indonesia | worldwide | indonesia_worldwide | selected
  default_countries: [Indonesia]
  # Countries searched explicitly when "Worldwide" is selected (plus generic remote/worldwide queries).
  worldwide_countries:
    - Singapore
    - Malaysia
    - Australia
    - Japan
    - United Arab Emirates
    - Germany
    - Netherlands
    - United Kingdom
    - United States
    - Canada
  default_employment_types: [full_time]
  default_work_arrangements: [remote, hybrid, onsite]
  default_publication_window_days: 7
  include_undisclosed_salary: true
  default_languages: [en, id]
  broad_discovery: true
  save_search_history: true
  include_previous_jobs: false

budget:
  # Hard caps to control API cost and request volume per run.
  max_search_engine_queries: 40        # total paid search API calls per run
  results_per_query: 20                # Brave max is 20
  max_pages_per_query: 1               # pagination depth (Brave offset max 9)
  max_pages_to_fetch: 60               # HTML pages fetched for extraction/verification
  max_ats_boards: 40                   # ATS boards crawled per run (seed + discovered)
  max_feed_items_per_source: 400       # items scanned per public job feed

discovery:
  enable_search_engines: true
  enable_job_portals: true
  enable_company_careers: true
  enable_ats: true
  enable_social_media: true
  enable_communities: true
  enable_other_sources: true
  # Connector classes loaded by the source registry ("module:Class").
  # Add your own connector here without touching the discovery engine.
  connectors:
    - src.sources.search_engine.web_search:WebSearchSource
    - src.sources.job_portals.indexed_portals:IndexedJobPortalSource
    - src.sources.job_portals.remote_feeds:RemotiveSource
    - src.sources.job_portals.remote_feeds:RemoteOKSource
    - src.sources.job_portals.remote_feeds:ArbeitnowSource
    - src.sources.job_portals.remote_feeds:JobicySource
    - src.sources.job_portals.remote_feeds:HimalayasSource
    - src.sources.job_portals.remote_feeds:WorkingNomadsSource
    - src.sources.job_portals.rss_feeds:WeWorkRemotelySource
    - src.sources.company_careers.career_pages:CompanyCareerPagesSource
    - src.sources.ats_platforms.ats:GreenhouseSource
    - src.sources.ats_platforms.ats:LeverSource
    - src.sources.ats_platforms.ats:AshbySource
    - src.sources.ats_platforms.ats:SmartRecruitersSource
    - src.sources.social_media.indexed_social:IndexedSocialMediaSource
    - src.sources.social_media.x_api:XRecentSearchSource
    - src.sources.communities.hackernews:HackerNewsHiringSource
    - src.sources.communities.reddit:RedditSource
    - src.sources.communities.indexed_communities:IndexedCommunitiesSource

extraction:
  fetch_pages_for_verification: true
  # Playwright is optional. When enabled and installed, JS-heavy pages that return
  # almost no text are re-rendered in a headless browser (robots.txt still applies).
  use_browser_rendering: false
  max_description_chars: 6000
  # Domains never fetched directly (login walls / terms of service). Their indexed
  # search snippets are still used.
  no_fetch_domains:
    - linkedin.com
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - glassdoor.com
    - glassdoor.co.id
    - indeed.com
    - id.indeed.com
    - threads.net

verification:
  scam_indicators:
    - registration fee
    - training fee
    - pay a fee
    - processing fee
    - biaya pendaftaran
    - biaya administrasi
    - biaya pelatihan
    - transfer uang
    - pay a deposit
    - security deposit for the job
    - earn $ per day
    - no experience needed, earn
    - work from home and earn
    - whatsapp only
    - telegram only
    - western union
    - crypto payment
  closed_indicators:
    - no longer accepting applications
    - this job is no longer available
    - this position has been filled
    - position has been filled
    - job has expired
    - this job has expired
    - posting has closed
    - applications are closed
    - lowongan ini sudah ditutup
    - lowongan sudah ditutup
    - lowongan telah berakhir
    - the job you are looking for is no longer
    - job not found

matching:
  weights:
    position: 25
    skills: 25
    experience: 15
    location: 15
    salary: 10
    freshness: 10
  thresholds:
    highly_relevant: 72
    relevant: 58
    potentially_relevant: 40
    needs_review_min: 25

ai:
  enabled: true
  # flash | flash-lite. Used only when AI_MODEL is empty: the newest stable model of
  # this family is resolved from the Gemini models.list endpoint at runtime.
  model_preference: flash
  max_calls_per_run: 25
  extraction_batch_size: 8
  matching_batch_size: 10
  max_jobs_for_ai_matching: 60
  cache_responses: true
  request_timeout_seconds: 90

performance:
  max_concurrency: 5
  request_timeout_seconds: 30
  retry_attempts: 2
  backoff_base_seconds: 1.5
  max_response_bytes: 4000000
  default_host_interval_seconds: 1.0
  # Minimum seconds between requests per host (politeness / provider rate limits).
  host_intervals:
    api.search.brave.com: 1.1
    remotive.com: 2.0
    remoteok.com: 2.0
    weworkremotely.com: 2.0
    www.workingnomads.com: 2.0
    www.reddit.com: 2.0
    oauth.reddit.com: 1.0
    hn.algolia.com: 0.5
    generativelanguage.googleapis.com: 0.5
    # Documented public job-board APIs (CDN-backed, built for programmatic access)
    boards-api.greenhouse.io: 0.25
    api.lever.co: 0.25
    api.ashbyhq.com: 0.25
    api.smartrecruiters.com: 0.25
  # Cache lifetime (hours) for public feeds - several providers ask for few calls/day.
  cache_ttl_hours:
    remotive.com: 6
    remoteok.com: 6
    www.arbeitnow.com: 1
    jobicy.com: 2
    himalayas.app: 2
    weworkremotely.com: 4
    www.workingnomads.com: 4
    default: 0.5

applications:
  # Multi-channel application automation (python main.py Interactive Hub, or --apply basic|ai|web --channel email|web|all).
  generated_cv_directory: data/generated_cvs     # tailored CV PDFs (git-ignored); originals in cv/ are never modified
  email_templates_file: config/email_templates.yaml
  email_language: auto                            # auto (from the posting) | en | id
  basic_cv_file: ""                               # PDF in cv/ attached in Basic mode; empty = ask / the only PDF
  max_jobs_per_run: 30                            # applications prepared per run
  allow_freemail_recipients: true                 # gmail.com/yahoo.com recruiter addresses (flagged in review)
  recipient_cooldown_days: 30                     # one application per recipient address within this period

  eligibility:                                    # Basic-mode filters (AI mode uses ai.min_match_score)
    min_relevance_score: 58
    allowed_relevance_categories: [HIGHLY RELEVANT, RELEVANT]
    excluded_verification_statuses: [CLOSED, POSSIBLE_SCAM, INACCESSIBLE]
    title_include_keywords: []                    # e.g. [developer, engineer]; empty = any title
    title_exclude_keywords: [intern, internship, magang, stagiair, stagiaire, praktikant, praktikum, werkstudent,
                             sales, director, head of,
                             m/w/d, w/m/d, m/f/d, f/m/d]   # German-market postings (German + local permit)
    allow_onsite_abroad: false                    # skip onsite/hybrid roles outside candidate.home_country
    max_seniority_gap: 1                          # skip roles more than this many levels above your level; null = off
    exclude_companies: []
    allowed_employment_types: []                  # e.g. [full_time, contract]; empty = any
    max_posting_age_days: 45
    require_email: true

  ai:
    min_match_score: 55                           # AI-mode jobs below this are REJECTED (no CV generated)
    rewrite_with_ai: true                         # false = reorder only, no AI rephrasing
    max_calls_per_run: 60                         # AI budget for one --apply ai run
    max_jobs_per_run: 10
    max_cv_pages: 3
    match_weights: {skills: 40, title: 25, experience: 20, keywords: 15}

  gmail:
    client_secret_file: data/secrets/gmail_client_secret.json   # or GMAIL_CLIENT_SECRET_FILE in .env
    token_file: data/secrets/gmail_token.json                   # or GMAIL_TOKEN_FILE in .env

  sending:
    # dry_run: true writes .eml files to outbox_directory and never contacts Gmail.
    # Set it to false only after checking the outbox and authorising Gmail (--gmail-auth).
    dry_run: true
    outbox_directory: data/outbox
    # How real e-mails reach Gmail:
    #   auto      - SMTP when GMAIL_APP_PASSWORD is set in .env, otherwise the Gmail API (OAuth)
    #   smtp      - smtp.gmail.com with an App Password (no Google Cloud project needed)
    #   gmail_api - Gmail API with OAuth, gmail.send scope only (most restricted access; preferred)
    transport: auto
    smtp_port: 587                   # 587 = STARTTLS, 465 = implicit TLS
    # End-to-end test: send every e-mail for real, but only to this address you own (or set
    # APPLICATION_TEST_RECIPIENT in .env). Employers receive nothing; applications return to review.
    test_recipient: ""
    # false = keep realistic Subject (intended employer stays in X-Original-To header);
    # true  = prefix Subject with "[TEST for <original>]".
    test_tag_subject: false
    mode: manual                     # manual (default) | scheduled | automatic
    automatic_enabled: false         # automatic mode also needs mode: automatic AND the --auto flag
    automatic_min_match_score: 75
    account_type: personal           # personal | workspace | workspace_trial (sets the documented ceiling)
    # Conservative defaults. Google's documented limits (personal ~500/day, Workspace 2,000/day) are
    # the points where Gmail BLOCKS sending, not safe targets. Values above half of them are refused.
    max_per_day: 35                  # option A: ~100 applications over ~3 working days
    max_per_hour: 8
    min_interval_seconds: 120
    max_per_recipient_domain_per_day: 2
    max_consecutive_failures: 3      # automatic pause after this many failures in a row
    max_invalid_recipients_per_day: 3
    quota_pause_hours: 24            # pause after a Gmail sending-limit/quota error
    max_send_attempts: 3             # transient-error retries for one e-mail (exponential backoff)
    backoff_base_seconds: 2
    max_wait_seconds: 900            # longest wait inside one --send-queue run before stopping
    max_attachment_mb: 10
    emergency_stop_file: data/STOP_SENDING   # create this file to stop all sending immediately
    sending_window:                  # local time (application.timezone)
      start_hour: 8
      end_hour: 18
      weekdays: [0, 1, 2, 3, 4]      # Monday=0

reporting:
  output_directory: reports
  docx_enabled: true
  xlsx_enabled: true
  write_raw_discovery_json: true
